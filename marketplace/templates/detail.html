<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{{ item.name }}</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                {% if item.image %}
                    <img src="{{ item.image.url }}" class="img-fluid rounded">
                {% else %}
                    <div class="bg-secondary text-white p-5 rounded text-center">No Image</div>
                {% endif %}
            </div>
            <div class="col-md-6">
                <h1>{{ item.name }}</h1>
                <p class="text-muted">Category: {{ item.category.name }}</p>
                <h3 class="text-success">${{ item.price }}</h3>
                <hr>
                <p>{{ item.description }}</p>
                <p class="small text-muted">Posted by: {{ item.created_by.username }}</p>
                <a href="{% url 'marketplace:index' %}" class="btn btn-outline-secondary">Back to Market</a>
            </div>
        </div>
    </div>
</body>
</html>
