{% extends 'base.html' %}

{% block content %}
<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for item in items %}
    <div class="col">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">{{ item.name }}</h5>
                <p class="card-text text-muted">${{ item.price }}</p>
                <a href="{% url 'marketplace:detail' item.id %}" class="btn btn-primary">View Item</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center">
        <p class="text-muted">No items found. Add some in the <a href="/admin/">Admin Panel</a>!</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
